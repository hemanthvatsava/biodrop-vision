<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BioDrop AI — Rover Vision Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      text-align: center;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h2 { font-size: 1.2rem; margin-bottom: 4px; color: #58a6ff; }
    p.subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 12px; }
    
    .status-badge {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #f0883e;
      margin-bottom: 12px;
      font-weight: 600;
      max-width: 90%;
    }
    .status-badge.connected { color: #3fb950; border-color: #238636; }

    .btn-group { display: flex; gap: 10px; margin-bottom: 12px; width: 100%; max-width: 400px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-ble { background-color: #238636; color: white; }
    .btn-cam { background-color: #1f6feb; color: white; }

    .feed-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #30363d;
      background: #000;
      aspect-ratio: 4 / 3;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; display: block; }

    .telemetry-card {
      margin-top: 12px;
      width: 100%;
      max-width: 380px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      text-align: left;
      font-size: 0.85rem;
    }
    .telemetry-card span.label { color: #8b949e; display: block; font-size: 0.72rem; text-transform: uppercase; }
    .telemetry-card span.val { color: #f0f6fc; font-weight: bold; font-family: monospace; font-size: 1rem; }

    .debug-box {
      margin-top: 10px;
      width: 100%;
      max-width: 380px;
      height: 100px;
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.7rem;
      color: #7ee787;
      text-align: left;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>🌱 BioDrop AI Vision Hub</h2>
  <p class="subtitle">Direct Rover Link & Target Tracker</p>

  <div id="statusBadge" class="status-badge">BLE: Disconnected</div>

  <div class="btn-group">
    <button class="btn-ble" onclick="connectHub()">1. Pair & Launch</button>
    <button class="btn-cam" onclick="startCamera()">2. Start Camera</button>
  </div>

  <div class="feed-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="telemetry-card">
    <div>
      <span class="label">Target X (0-100)</span>
      <span id="targetXVal" class="val">--</span>
    </div>
    <div>
      <span class="label">Target Size</span>
      <span id="targetSizeVal" class="val">--</span>
    </div>
    <div>
      <span class="label">Packet Rate</span>
      <span id="packetRateVal" class="val">0 Hz</span>
    </div>
    <div>
      <span class="label">Optical Lock</span>
      <span id="lockStatusVal" class="val" style="color: #f85149;">LOST</span>
    </div>
  </div>

  <div id="debugLog" class="debug-box">[Ready] Turn on hub and tap "1. Pair & Launch"&#10;</div>

  <script>
    const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const UART_TX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

    let txChar = null;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const statusBadge = document.getElementById('statusBadge');
    const targetXVal = document.getElementById('targetXVal');
    const targetSizeVal = document.getElementById('targetSizeVal');
    const packetRateVal = document.getElementById('packetRateVal');
    const lockStatusVal = document.getElementById('lockStatusVal');
    const debugLog = document.getElementById('debugLog');

    function log(msg) {
      const time = new Date().toISOString().split('T')[1].slice(0, 8);
      debugLog.innerText += `[${time}] ${msg}\n`;
      debugLog.scrollTop = debugLog.scrollHeight;
    }

    let packetsSent = 0;
    setInterval(() => {
      packetRateVal.innerText = `${packetsSent} Hz`;
      packetsSent = 0;
    }, 1000);

    // MicroPython receiver code sent directly into REPL upon connection
    const HUB_CODE = `
from pybricks.hubs import PrimeHub
from pybricks.parameters import Axis, Direction, Port
from pybricks.pupdevices import Motor
from pybricks.robotics import DriveBase
import uselect, usys

hub = PrimeHub(top_side=Axis.Z, front_side=Axis.Y)
hub.speaker.volume(100)
left_motor = Motor(Port.F, Direction.COUNTERCLOCKWISE)
right_motor = Motor(Port.B, Direction.CLOCKWISE)
drive = DriveBase(left_motor, right_motor, 56, 114)

poller = uselect.poll()
poller.register(usys.stdin, uselect.POLLIN)

hub.display.char("R")
hub.speaker.beep(880, 150)

buf = ""
while True:
    while poller.poll(0):
        c = usys.stdin.read(1)
        if not c:
            break
        if c in ("\\n", "\\r"):
            if buf:
                try:
                    p = buf.strip().split(",")
                    if len(p) >= 2:
                        x = int(p[0])
                        size = int(p[1])
                        hub.display.pixel(2, 2, 100)
                        err = x - 50
                        steer = err * 2
                        speed = 130 if size < 35 else 0
                        drive.drive(speed, steer)
                except:
                    pass
                buf = ""
        else:
            buf += c
`;

    async function connectHub() {
      try {
        log("Scanning for Pybricks Hub...");
        statusBadge.innerText = "Scanning for Hub...";
        statusBadge.classList.remove('connected');

        const device = await navigator.bluetooth.requestDevice({
          filters: [
            { services: [UART_SERVICE] },
            { namePrefix: 'Pybricks' }
          ],
          optionalServices: [UART_SERVICE]
        });

        log("Connecting to GATT...");
        const server = await device.gatt.connect();
        
        await new Promise(r => setTimeout(r, 400));
        const service = await server.getPrimaryService(UART_SERVICE);
        txChar = await service.getCharacteristic(UART_TX);

        log("GATT linked! Bootstrapping Python engine on Hub...");
        statusBadge.innerText = "Launching Script on Hub...";

        // Step 1: Send Ctrl+C twice to break any previous loop
        await txChar.writeValueWithoutResponse(new Uint8Array([0x03, 0x03]));
        await new Promise(r => setTimeout(r, 300));

        // Step 2: Send Ctrl+E to enter MicroPython Paste Mode
        await txChar.writeValueWithoutResponse(new Uint8Array([0x05]));
        await new Promise(r => setTimeout(r, 200));

        // Step 3: Stream the Python program text in chunks
        const encoded = new TextEncoder().encode(HUB_CODE.trim() + "\n");
        const chunkSize = 64;
        for (let i = 0; i < encoded.length; i += chunkSize) {
          const chunk = encoded.slice(i, i + chunkSize);
          await txChar.writeValueWithoutResponse(chunk);
          await new Promise(r => setTimeout(r, 25));
        }

        // Step 4: Send Ctrl+D to execute the pasted program
        await new Promise(r => setTimeout(r, 200));
        await txChar.writeValueWithoutResponse(new Uint8Array([0x04]));

        log("SUCCESS: Program executed! Hub shows 'R'.");
        statusBadge.innerText = "BLE: Connected & Running";
        statusBadge.classList.add('connected');
      } catch (err) {
        log(`BLE Error: ${err.message || err.name || err}`);
        statusBadge.innerText = "BLE Error: " + (err.message || err.name || "Failed");
        statusBadge.classList.remove('connected');
      }
    }

    async function startCamera() {
      try {
        log("Starting Camera feed...");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 320 },
            height: { ideal: 240 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.play();
        requestAnimationFrame(processVideoFrame);
      } catch (err) {
        log(`Camera Error: ${err.message}`);
      }
    }

    let lastSendTime = 0;

    function processVideoFrame(timestamp) {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;
        let sumX = 0, sumY = 0, count = 0;

        const step = 4;
        for (let y = 0; y < canvas.height; y += step) {
          for (let x = 0; x < canvas.width; x += step) {
            const idx = (y * canvas.width + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];

            if (g > 85 && g > r * 1.35 && g > b * 1.35) {
              sumX += x;
              sumY += y;
              count++;
            }
          }
        }

        if (count > 15) {
          const avgX = sumX / count;
          const avgY = sumY / count;
          
          const normX = Math.round((avgX / canvas.width) * 100);
          const normSize = Math.min(100, Math.round((count / ((canvas.width * canvas.height) / (step * step) * 0.15)) * 100));

          targetXVal.innerText = normX;
          targetSizeVal.innerText = normSize;
          lockStatusVal.innerText = "LOCKED";
          lockStatusVal.style.color = "#3fb950";

          ctx.strokeStyle = "#3fb950";
          ctx.lineWidth = 3;
          ctx.strokeRect(avgX - 30, avgY - 30, 60, 60);
          ctx.beginPath();
          ctx.moveTo(avgX, avgY - 40); ctx.lineTo(avgX, avgY + 40);
          ctx.moveTo(avgX - 40, avgY); ctx.lineTo(avgX + 40, avgY);
          ctx.stroke();

          if (txChar && (timestamp - lastSendTime > 60)) {
            lastSendTime = timestamp;
            const payload = new TextEncoder().encode(`${normX},${normSize}\n`);
            txChar.writeValueWithoutResponse(payload)
              .then(() => { packetsSent++; })
              .catch(() => {});
          }
        } else {
          targetXVal.innerText = "--";
          targetSizeVal.innerText = "--";
          lockStatusVal.innerText = "LOST";
          lockStatusVal.style.color = "#f85149";
        }
      }

      requestAnimationFrame(processVideoFrame);
    }
  </script>
</body>
</html>
