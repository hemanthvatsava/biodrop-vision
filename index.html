<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BioDrop AI — Rover Vision Tracker (Debug)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      text-align: center;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h2 { font-size: 1.15rem; margin-bottom: 4px; color: #58a6ff; }
    p.subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 10px; }
    
    .status-badge {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #f0883e;
      margin-bottom: 10px;
      font-weight: 600;
      word-break: break-word;
      max-width: 90%;
    }
    .status-badge.connected { color: #3fb950; border-color: #238636; }

    .btn-group { display: flex; gap: 8px; margin-bottom: 10px; width: 100%; max-width: 400px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-ble { background-color: #238636; color: white; }
    .btn-cam { background-color: #1f6feb; color: white; }

    .feed-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #30363d;
      background: #000;
      aspect-ratio: 4 / 3;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; display: block; }

    .telemetry-card {
      margin-top: 10px;
      width: 100%;
      max-width: 380px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      text-align: left;
      font-size: 0.8rem;
    }
    .telemetry-card span.label { color: #8b949e; display: block; font-size: 0.7rem; text-transform: uppercase; }
    .telemetry-card span.val { color: #f0f6fc; font-weight: bold; font-family: monospace; font-size: 0.95rem; }

    .debug-container {
      margin-top: 10px;
      width: 100%;
      max-width: 380px;
      text-align: left;
    }
    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 4px;
    }
    .debug-box {
      width: 100%;
      height: 140px;
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.68rem;
      color: #7ee787;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h2>🌱 BioDrop AI Vision Hub</h2>
  <p class="subtitle">Diagnostic BLE Live Trace & Vision Engine</p>

  <div id="statusBadge" class="status-badge">BLE: Disconnected</div>

  <div class="btn-group">
    <button class="btn-ble" onclick="connectHub()">1. Pair Hub</button>
    <button class="btn-cam" onclick="startCamera()">2. Start Camera</button>
  </div>

  <div class="feed-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="telemetry-card">
    <div>
      <span class="label">Target X (0-100)</span>
      <span id="targetXVal" class="val">--</span>
    </div>
    <div>
      <span class="label">Target Size</span>
      <span id="targetSizeVal" class="val">--</span>
    </div>
    <div>
      <span class="label">BLE Stream Rate</span>
      <span id="packetRateVal" class="val">0 Hz</span>
    </div>
    <div>
      <span class="label">Optical Lock</span>
      <span id="lockStatusVal" class="val" style="color: #f85149;">LOST</span>
    </div>
  </div>

  <div class="debug-container">
    <div class="debug-header">
      <span>BLE Diagnostic Trace:</span>
      <span style="text-decoration: underline; cursor: pointer;" onclick="clearLog()">Clear</span>
    </div>
    <div id="debugLog" class="debug-box">[Ready] Tap "1. Pair Hub" to begin.&#10;</div>
  </div>

  <script>
    const PYBRICKS_SERVICE = 'c5f50001-8280-46da-89f4-6d8051e4aeef';
    const PYBRICKS_CHAR    = 'c5f50002-8280-46da-89f4-6d8051e4aeef';

    let txCharacteristic = null;
    let cameraStarted = false;
    let isWriting = false;

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const statusBadge = document.getElementById('statusBadge');
    const targetXVal = document.getElementById('targetXVal');
    const targetSizeVal = document.getElementById('targetSizeVal');
    const packetRateVal = document.getElementById('packetRateVal');
    const lockStatusVal = document.getElementById('lockStatusVal');
    const debugLog = document.getElementById('debugLog');

    function log(msg) {
      const time = new Date().toISOString().split('T')[1].slice(0, 8);
      debugLog.innerText += `[${time}] ${msg}\n`;
      debugLog.scrollTop = debugLog.scrollHeight;
    }

    function clearLog() {
      debugLog.innerText = '';
    }

    let packetsSent = 0;
    setInterval(() => {
      packetRateVal.innerText = `${packetsSent} Hz`;
      packetsSent = 0;
    }, 1000);

    async function connectHub() {
      try {
        log("1. Requesting Pybricks BLE Device...");
        statusBadge.innerText = "Scanning for Hub...";
        statusBadge.classList.remove('connected');

        const device = await navigator.bluetooth.requestDevice({
          filters: [
            { services: [PYBRICKS_SERVICE] },
            { namePrefix: 'Pybricks' }
          ],
          optionalServices: [PYBRICKS_SERVICE]
        });

        log(`Device: ${device.name || "Hub"} (id: ${device.id.slice(0, 8)}...)`);

        device.addEventListener('gattserverdisconnected', () => {
          log("WARNING: GATT disconnected!");
          statusBadge.innerText = "BLE: Disconnected";
          statusBadge.classList.remove('connected');
          txCharacteristic = null;
        });

        log("2. Connecting to GATT Server...");
        const server = await device.gatt.connect();

        await new Promise(r => setTimeout(r, 400));
        log("3. Discovering Pybricks Service...");

        const service = await server.getPrimaryService(PYBRICKS_SERVICE);
        txCharacteristic = await service.getCharacteristic(PYBRICKS_CHAR);

        // Inspect supported properties
        const props = txCharacteristic.properties;
        log(`Char Props: write=${props.write}, writeWithoutResponse=${props.writeWithoutResponse}, notify=${props.notify}`);

        // Subscribe to notifications to capture hub responses/errors
        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
          const val = new Uint8Array(event.target.value.buffer);
          log(`Hub Notify [${val.length}B]: ${Array.from(val).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' ')}`);
        });
        log("Notifications active.");

        log("SUCCESS: Link open. Ready to stream vision data.");
        statusBadge.innerText = "BLE: Connected & Ready";
        statusBadge.classList.add('connected');
      } catch (err) {
        log(`FATAL: ${err.name || 'Error'} -> ${err.message || err}`);
        statusBadge.innerText = "BLE Error: " + (err.message || err.name || "Failed");
        statusBadge.classList.remove('connected');
      }
    }

    async function startCamera() {
      try {
        log("Requesting camera stream...");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.setAttribute("playsinline", "true");
        video.setAttribute("webkit-playsinline", "true");
        video.muted = true;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            log(`Camera active: ${video.videoWidth}x${video.videoHeight}`);
            if (!cameraStarted) {
              cameraStarted = true;
              requestAnimationFrame(processVideoFrame);
            }
          } catch (playErr) {
            log(`Video play error: ${playErr.message}`);
          }
        };
      } catch (err) {
        log(`Camera Error: ${err.message}`);
        alert("Camera Error: " + err.message);
      }
    }

    let lastSendTime = 0;
    let writeAttempts = 0;

    async function transmitCoordinates(normX, normSize) {
      if (!txCharacteristic || isWriting) return;

      isWriting = true;
      writeAttempts++;
      const payloadStr = `${normX},${normSize}\n`;
      const textBytes = new TextEncoder().encode(payloadStr);

      // Wrap payload with Pybricks PBIO stdin header (0x06)
      const packet = new Uint8Array(textBytes.length + 1);
      packet[0] = 0x06;
      packet.set(textBytes, 1);

      try {
        if (txCharacteristic.properties.writeWithoutResponse) {
          await txCharacteristic.writeValueWithoutResponse(packet);
        } else {
          await txCharacteristic.writeValueWithResponse(packet);
        }
        packetsSent++;
        if (writeAttempts % 30 === 1) {
          log(`Sent OK: "${payloadStr.trim()}" (packet size: ${packet.length}B)`);
        }
      } catch (err) {
        log(`WRITE ERROR [attempt #${writeAttempts}]: ${err.message || err}`);
      } finally {
        isWriting = false;
      }
    }

    function processVideoFrame(timestamp) {
      if (video.readyState >= video.HAVE_CURRENT_DATA) {
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;
        let sumX = 0, sumY = 0, count = 0;

        const step = 4;
        for (let y = 0; y < canvas.height; y += step) {
          for (let x = 0; x < canvas.width; x += step) {
            const idx = (y * canvas.width + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];

            if (g > 85 && g > r * 1.35 && g > b * 1.35) {
              sumX += x;
              sumY += y;
              count++;
            }
          }
        }

        if (count > 15) {
          const avgX = sumX / count;
          const avgY = sumY / count;
          
          const normX = Math.round((avgX / canvas.width) * 100);
          const normSize = Math.min(100, Math.round((count / ((canvas.width * canvas.height) / (step * step) * 0.15)) * 100));

          targetXVal.innerText = normX;
          targetSizeVal.innerText = normSize;
          lockStatusVal.innerText = "LOCKED";
          lockStatusVal.style.color = "#3fb950";

          // Reticle drawing
          ctx.strokeStyle = "#3fb950";
          ctx.lineWidth = 3;
          ctx.strokeRect(avgX - 30, avgY - 30, 60, 60);
          ctx.beginPath();
          ctx.moveTo(avgX, avgY - 40); ctx.lineTo(avgX, avgY + 40);
          ctx.moveTo(avgX - 40, avgY); ctx.lineTo(avgX + 40, avgY);
          ctx.stroke();

          // Transmit rate limiter (approx. 12-14 Hz)
          if (timestamp - lastSendTime > 75) {
            lastSendTime = timestamp;
            transmitCoordinates(normX, normSize);
          }
        } else {
          targetXVal.innerText = "--";
          targetSizeVal.innerText = "--";
          lockStatusVal.innerText = "LOST";
          lockStatusVal.style.color = "#f85149";
        }
      }

      requestAnimationFrame(processVideoFrame);
    }
  </script>
</body>
</html>
